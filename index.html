<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fff6e9" />
    <link rel="icon" href="./icon.svg" />
    <title>TAP to PICK</title>
  </head>
  <body>
    <main id="app">
      <section class="screen studio-splash-screen" id="screen-studio-splash" aria-label="TapeeTepee studio">
        <img class="studio-splash-cover" src="./assets/brand/tapeetepee-open-01.webp" alt="TapeeTepee open studio" />
      </section>
      <section class="screen splash-screen hidden" id="screen-splash" aria-label="TAP to PICK">
        <img class="splash-cover" id="product-cover" alt="TAP to PICK" />
      </section>
      <section class="screen title-screen hidden" id="screen-title">
        <header class="brand-block">
          <h1 class="brand"><img class="brand-mark" id="brand-mark" alt="TAP to PICK" /></h1>
        </header>
        <nav class="mode-list" aria-label="Game modes">
          <button class="mode-btn" id="mode-unit"><span class="mode-name">Picture Pieces</span><span class="mode-desc">Find every piece on a 7×7 board with 5 chances.</span></button>
          <button class="mode-btn" id="mode-montage"><span class="mode-name">Montage Hunt</span><span class="mode-desc">Clear 4 stages with 5 hearts, from 2×2 to 5×5.</span></button>
          <button class="mode-btn" id="mode-memory"><span class="mode-name">Pair Memory</span><span class="mode-desc">Match the faces through 4 stages, from 4×4 to 7×7.</span></button>
        </nav>
        <div class="title-links">
          <button class="text-btn" id="btn-title-tutorial">How to play</button>
          <button class="text-btn" id="btn-title-settings">Settings</button>
          <button class="text-btn" id="btn-title-rules">Rules</button>
        </div>
      </section>

      <section class="screen talk-screen pick-screen hidden" id="screen-game">
        <header class="hud">
          <button class="icon-btn" id="btn-back" aria-label="Back to menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></button>
          <div class="run-heading"><span id="run-mode">Picture Pieces</span><strong id="run-clock">00:00.0</strong><div id="run-lives" class="life-meter hidden" role="img" aria-label="5 of 5 lives remaining" aria-live="polite"></div></div>
          <button class="icon-btn pause-btn" id="btn-pause" aria-label="Pause"><span aria-hidden="true"></span></button>
        </header>
        <section class="pick-target" aria-live="polite"><p id="montage-status" class="montage-status hidden"></p><p class="target-character-name hidden" id="target-character-name"></p><div class="target-preview" id="target-preview"></div></section>
        <div class="pick-progress"><span id="progress-label">0 / 0</span><div class="progress-track"><i id="progress-fill"></i></div></div>
        <div class="picture-board picture-board--7" id="picture-board" aria-label="Picture puzzle board"></div>
      </section>

      <div id="damage-flash" class="damage-flash" aria-hidden="true"></div>
      <div class="cheer hidden" id="cheer" aria-hidden="true">
        <div class="cheer-card" id="cheer-card"><p class="cheer-headline" id="cheer-headline">COMPLETE</p><p class="cheer-score-label" id="cheer-score-label">SCORE</p><p class="cheer-score" id="cheer-score">0</p></div>
        <div class="cheer-word" id="cheer-word">GREAT!</div>
        <video class="cheer-clip hidden" id="cheer-clip" muted playsinline disablepictureinpicture preload="auto"></video>
        <audio id="cheer-sound" preload="auto"></audio>
        <p class="cheer-tap" id="cheer-tap">Tap to continue</p>
      </div>
      <div class="result-layer hidden" id="result-layer" role="dialog" aria-modal="true">
        <div class="result-panel"><p class="result-kicker">FINISH</p><h2 id="result-title">Complete!</h2><p id="result-detail"></p><button class="wood-btn" id="btn-again">Play again</button><button class="text-btn" id="btn-result-menu">Menu</button></div>
      </div>
      <div class="help-layer hidden" id="help-layer" role="dialog" aria-modal="true" aria-labelledby="help-title">
        <section class="help-panel"><header class="help-head"><button class="icon-btn" id="btn-help-close" aria-label="Close"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button><h2 id="help-title">How to play</h2><span class="icon-spacer" aria-hidden="true"></span></header><div class="help-body" id="help-body"></div></section>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
